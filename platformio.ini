[env:esp32dev]
platform = espressif32
board = esp32dev          ; confirmed: Hosyond/Sunton E32R40T, onboard ESP32-32E
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv   ; no OTA partition — gives ~3MB to the app instead of 1.25MB
; Decodes crash register dumps (PC/backtrace addresses) into real function
; names + file/line using this build's .elf — added while chasing a
; stack-overflow crash whose PC/stack-pointer have been identical across
; every occurrence, pointing at a fixed, non-application task we can't
; otherwise identify from raw addresses alone.
monitor_filters = esp32_exception_decoder
lib_deps =
    lvgl/lvgl @ ^8.3.14
    lovyan03/LovyanGFX @ ^1.1.12
    bblanchon/ArduinoJson @ ^7.0.4
    ; TJpg_Decoder removed with the album-art feature (see git history).
build_flags =
    -I include
    -D LV_CONF_PATH=lv_conf_c.h
    ; Silence the Arduino core's own error logs — chiefly the harmless
    ; [E][ssl_client.cpp] "(-76) NET_RECV_FAILED" that Spotify's TLS stack prints
    ; on connection teardown after every *successful* poll, plus WiFiClient write
    ; spam. Our own Serial.printf diagnostics are direct Serial writes and print
    ; regardless. Raise to 3 (Error) when you need framework logs for debugging.
    -D CORE_DEBUG_LEVEL=0